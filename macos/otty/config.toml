font-blending = "linear"
theme = "Floating Card"
theme-dark = "Glass Dark"
foreground = "#24292e"
background = "#ffffff"
palette-0 = "#24292e"
open-with-app = "Zed|dev.zed.Zed"

quit-after-last-window-closed = true

window-working-directory = "home"

default-git-client = "dev.zed.Zed"

editor-vim = true

editor-visible-whitespace = true

# unfocused-split-opacity = 0.55 (reset to default)

palette-1 = "#d73a49"
palette-2 = "#28a745"
palette-3 = "#dbab09"
palette-4 = "#0366d6"
palette-5 = "#5a32a3"
palette-6 = "#0598bc"
palette-7 = "#45494e"
palette-8 = "#959da5"
palette-9 = "#cb2431"
palette-10 = "#22863a"
palette-11 = "#b08800"
palette-12 = "#005cc5"
palette-13 = "#5a32a3"
palette-14 = "#3192aa"

palette-15 = "#191c20"

# selection-foreground = "#2a2422" (reset to default)
selection-background = "#e4e4e7"
cursor-color = "#18181b"
# cursor-text = "#f5f0f0" (reset to default)

dock-icon-animate-progress = true

font-size = 15

window-layout = "tabs-bottom"
